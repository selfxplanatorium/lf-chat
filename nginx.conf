# LF CHAT reverse proxy.
#
# Architecture: a single Express process (the Docker container) serves BOTH the
# API (/api/*) and the built frontend (everything else) from one port (default
# 3000). nginx terminates TLS and forwards all traffic to it. Do NOT use
# try_files / static root here — that would serve index.html for /api/* and
# break the API.
#
# If nginx runs on the host in front of `docker compose` (which publishes
# 3000 on the host), use http://127.0.0.1:3000. If nginx is itself a container
# on the same Docker network as the lf-chat service, use http://lf-chat:3000
# (the service name from docker-compose.yml) and remove the port mapping from
# docker-compose.yml (expose-only).
#
# Replace YOUR_DOMAIN with your actual domain name in both server blocks below.
#
# Certbot / Let's Encrypt setup (run once on the server):
#
#   1. Install certbot:
#        sudo apt install certbot python3-certbot-nginx   # Debian/Ubuntu
#        sudo dnf install certbot python3-certbot-nginx   # Fedora/RHEL
#
#   2. Obtain a certificate (nginx must be running and port 80 reachable):
#        sudo certbot --nginx -d YOUR_DOMAIN
#
#   3. Certbot writes:
#        /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
#        /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem
#      and auto-renews via a systemd timer or cron job.
#
#   4. Test auto-renewal:
#        sudo certbot renew --dry-run

# The upstream Express server. Change to http://lf-chat:3000 for a
# container-network setup (and adjust docker-compose.yml accordingly).
upstream lf_chat_backend {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # ACME challenge passthrough for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # --- TLS certificates (certbot output paths) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;  # TLSv1.3 ignores this; off is correct for modern configs
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — belt-and-suspenders alongside the helmet header set by Express.
    # max-age=63072000 = 2 years. Add includeSubDomains/preload only when ready.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Gzip (only for non-SSE responses; SSE is unbuffered below)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Forward everything to the Express backend, which serves both /api/* and
    # the SPA (with its own index.html fallback for client-side routing).

    # SSE: the chat stream lives under /api/conversations/*/events. Disable
    # buffering and raise timeouts so long-lived streams and slow TTFT models
    # (e.g. Claude Opus) don't get cut off at the default 60s proxy timeout.
    location /api/ {
        proxy_pass http://lf_chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-friendly defaults; harmless for normal request/response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # Everything else (frontend assets, SPA routes) — same upstream, but
    # buffering is fine for static content.
    location / {
        proxy_pass http://lf_chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
